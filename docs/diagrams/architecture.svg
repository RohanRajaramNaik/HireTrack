<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" font-family="Segoe UI, Inter, Arial, sans-serif">
<rect width="1200" height="990" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">HireTrack: three-tier architecture (one computer, 127.0.0.1)</text>
<text x="40" y="80" font-size="12" font-weight="700" fill="#475569" text-anchor="start">PRESENTATION TIER</text>
<text x="40" y="330" font-size="12" font-weight="700" fill="#475569" text-anchor="start">APPLICATION TIER</text>
<text x="40" y="820" font-size="12" font-weight="700" fill="#475569" text-anchor="start">DATA TIER</text>
<rect x="40" y="92" width="1120" height="196" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="60" y="120" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">Web browser (Edge, Chrome) - React 18 single-page app built with Vite, styled with Tailwind CSS</text>
<rect x="60" y="138" width="124" height="44" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="122" y="166" font-size="14" font-weight="600" fill="#1d3fbf" text-anchor="middle">Sign in</text>
<rect x="196" y="138" width="124" height="44" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="258" y="166" font-size="14" font-weight="600" fill="#1d3fbf" text-anchor="middle">Dashboard</text>
<rect x="332" y="138" width="124" height="44" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="394" y="166" font-size="14" font-weight="600" fill="#1d3fbf" text-anchor="middle">Candidates</text>
<rect x="468" y="138" width="124" height="44" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="530" y="166" font-size="14" font-weight="600" fill="#1d3fbf" text-anchor="middle">Jobs</text>
<rect x="604" y="138" width="124" height="44" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="666" y="166" font-size="14" font-weight="600" fill="#1d3fbf" text-anchor="middle">Matching</text>
<rect x="740" y="138" width="124" height="44" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="802" y="166" font-size="14" font-weight="600" fill="#1d3fbf" text-anchor="middle">Pipeline</text>
<rect x="876" y="138" width="124" height="44" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="938" y="166" font-size="14" font-weight="600" fill="#1d3fbf" text-anchor="middle">Resources</text>
<rect x="1012" y="138" width="124" height="44" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="1074" y="166" font-size="14" font-weight="600" fill="#1d3fbf" text-anchor="middle">Admin</text>
<rect x="60" y="198" width="520" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="76" y="222" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">lib/auth.jsx  - signed-in user, role checks (can())</text>
<text x="76" y="244" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">lib/validation.js - same rules as the server, inline errors</text>
<text x="76" y="264" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">lib/scoring.js - client re-rank for 'What if' weights</text>
<rect x="600" y="198" width="540" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="616" y="222" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">apiClient.js - one place for every HTTP call</text>
<text x="616" y="244" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">sends Authorization: Bearer &lt;JWT&gt;; 401 signs the user out</text>
<text x="616" y="264" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">uploads (CV, CSV/XLSX) and authenticated CSV download</text>
<polyline points="600,290 600,340" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="612" y="322" font-size="13" font-weight="600" fill="#475569" text-anchor="start">HTTP + JSON (REST)   /api/...   JWT bearer token</text>
<rect x="40" y="344" width="1120" height="440" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="60" y="372" font-size="15" font-weight="600" fill="#0f172a" text-anchor="start">FastAPI application served by Uvicorn (Python 3.11) - also serves the built frontend on the same port</text>
<rect x="60" y="388" width="1080" height="52" rx="6" fill="#eef2ff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="76" y="410" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">security.py - bcrypt passwords, JWT (HS256, 8 h), require_roles(...) on every route, login lock-out,</text>
<text x="76" y="430" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">password re-confirmation for destructive admin actions.  main.py - one error shape {detail, field}, CORS 127.0.0.1 only</text>
<text x="60" y="466" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Routers (HTTP layer, Pydantic validation)</text>
<rect x="60" y="476" width="136" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="128.0" y="500" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">auth / users</text>
<rect x="206" y="476" width="168" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="290.0" y="500" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">candidates (+ import, CV)</text>
<rect x="384" y="476" width="136" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="452.0" y="500" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">jobs</text>
<rect x="530" y="476" width="168" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="614.0" y="500" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">match / dashboard</text>
<rect x="708" y="476" width="136" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="776.0" y="500" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">pipeline</text>
<rect x="854" y="476" width="136" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="922.0" y="500" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">resources</text>
<rect x="1000" y="476" width="136" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1068.0" y="500" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">admin</text>
<polyline points="600,516 600,538" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="60" y="560" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Services (business rules, transactions)</text>
<rect x="60" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="109.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">user</text>
<rect x="168" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="217.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">candidate</text>
<rect x="276" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="325.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">import</text>
<rect x="384" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="433.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">job</text>
<rect x="492" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="541.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">match</text>
<rect x="600" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="649.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">pipeline</text>
<rect x="708" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="757.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">resource</text>
<rect x="816" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="865.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">dashboard</text>
<rect x="924" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="973.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">seed</text>
<rect x="1032" y="570" width="99" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1081.5" y="593" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">backup</text>
<polyline points="600,608 600,630" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="60" y="652" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Engine (pure Python, no database code, unit tested on its own)</text>
<rect x="60" y="662" width="206" height="100" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="74" y="688" font-size="14" font-weight="700" fill="#1d3fbf" text-anchor="start">scoring.py</text>
<text x="74" y="712" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">skills, experience, education,</text>
<text x="74" y="732" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">meaning, overall, ranking</text>
<rect x="278" y="662" width="206" height="100" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="292" y="688" font-size="14" font-weight="700" fill="#1d3fbf" text-anchor="start">embeddings.py</text>
<text x="292" y="712" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">all-MiniLM-L6-v2 vectors,</text>
<text x="292" y="732" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">cached by text hash</text>
<rect x="496" y="662" width="206" height="100" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="510" y="688" font-size="14" font-weight="700" fill="#1d3fbf" text-anchor="start">skills.py</text>
<text x="510" y="712" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">SkillNormaliser,</text>
<text x="510" y="732" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">~90 aliases (JS, K8s...)</text>
<rect x="714" y="662" width="206" height="100" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="728" y="688" font-size="14" font-weight="700" fill="#1d3fbf" text-anchor="start">pipeline.py</text>
<text x="728" y="712" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">stage order, allowed moves,</text>
<text x="728" y="732" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">funnel</text>
<rect x="932" y="662" width="206" height="100" rx="6" fill="#ffffff" stroke="#1d3fbf" stroke-width="1.5"/>
<text x="946" y="688" font-size="14" font-weight="700" fill="#1d3fbf" text-anchor="start">allocation.py</text>
<text x="946" y="712" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">peak load per day,</text>
<text x="946" y="732" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">no booking above 100%</text>
<polyline points="600,786 600,836" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="612" y="816" font-size="13" font-weight="600" fill="#475569" text-anchor="start">SQLAlchemy 2 ORM (bound parameters only; PRAGMA foreign_keys=ON)</text>
<rect x="40" y="840" width="214" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="54" y="866" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">data/hiretrack.db</text>
<text x="54" y="890" font-size="12" font-weight="400" fill="#475569" text-anchor="start">SQLite database: 14 tables,</text>
<text x="54" y="910" font-size="12" font-weight="400" fill="#475569" text-anchor="start">CHECK, UNIQUE and FK rules</text>
<rect x="266" y="840" width="214" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="280" y="866" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">models/all-MiniLM-L6-v2</text>
<text x="280" y="890" font-size="12" font-weight="400" fill="#475569" text-anchor="start">local language model (~90 MB),</text>
<text x="280" y="910" font-size="12" font-weight="400" fill="#475569" text-anchor="start">downloaded once, then offline</text>
<rect x="492" y="840" width="214" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="506" y="866" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">data/embedding_cache.npz</text>
<text x="506" y="890" font-size="12" font-weight="400" fill="#475569" text-anchor="start">CV vectors keyed by SHA-1</text>
<text x="506" y="910" font-size="12" font-weight="400" fill="#475569" text-anchor="start">(no CV text stored)</text>
<rect x="718" y="840" width="214" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="732" y="866" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">backups/</text>
<text x="732" y="890" font-size="12" font-weight="400" fill="#475569" text-anchor="start">daily, pre-seed, pre-restore and</text>
<text x="732" y="910" font-size="12" font-weight="400" fill="#475569" text-anchor="start">manual copies (10 kept)</text>
<rect x="944" y="840" width="214" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="958" y="866" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">logs/app.log</text>
<text x="958" y="890" font-size="12" font-weight="400" fill="#475569" text-anchor="start">rotating 1 MB x 5;</text>
<text x="958" y="910" font-size="12" font-weight="400" fill="#475569" text-anchor="start">ids and counts only</text>
<text x="40" y="970" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Internet is used only during installation (pip, npm, model download). At run time HF_HUB_OFFLINE=1 and the server binds to 127.0.0.1.</text>
</svg>
