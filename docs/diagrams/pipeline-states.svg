<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="420" viewBox="0 0 1260 420" font-family="Segoe UI, Inter, Arial, sans-serif">
<rect width="1260" height="420" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Applicant pipeline: allowed stage changes (engine/pipeline.py)</text>
<rect x="60" y="110" width="170" height="60" rx="30" fill="#eef2ff" stroke="#1d3fbf" stroke-width="2"/>
<text x="145" y="146" font-size="16" font-weight="700" fill="#1d3fbf" text-anchor="middle">Applied</text>
<polyline points="232,140 286,140" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="290" y="110" width="170" height="60" rx="30" fill="#eef2ff" stroke="#1d3fbf" stroke-width="2"/>
<text x="375" y="146" font-size="16" font-weight="700" fill="#1d3fbf" text-anchor="middle">Screened</text>
<polyline points="462,140 516,140" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="520" y="110" width="170" height="60" rx="30" fill="#eef2ff" stroke="#1d3fbf" stroke-width="2"/>
<text x="605" y="146" font-size="16" font-weight="700" fill="#1d3fbf" text-anchor="middle">Interview</text>
<polyline points="692,140 746,140" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="750" y="110" width="170" height="60" rx="30" fill="#eef2ff" stroke="#1d3fbf" stroke-width="2"/>
<text x="835" y="146" font-size="16" font-weight="700" fill="#1d3fbf" text-anchor="middle">Offer</text>
<polyline points="922,140 976,140" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="980" y="110" width="170" height="60" rx="30" fill="#ecfaf1" stroke="#157a3b" stroke-width="2"/>
<text x="1065" y="146" font-size="16" font-weight="700" fill="#157a3b" text-anchor="middle">Hired</text>
<rect x="520" y="300" width="170" height="60" rx="30" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="605" y="336" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">Rejected</text>
<path d="M145,172 C145,250 600,230 605,298" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M375,172 C375,250 600,230 605,298" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M605,172 C605,250 600,230 605,298" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M835,172 C835,250 600,230 605,298" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M520,330 C330,330 160,250 145,174" fill="none" stroke="#1d3fbf" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="120" y="360" font-size="12" font-weight="400" fill="#1d3fbf" text-anchor="middle">reopen: back to the stage</text>
<text x="120" y="376" font-size="12" font-weight="400" fill="#1d3fbf" text-anchor="middle">it was rejected from</text>
<text x="760" y="270" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Rules</text>
<text x="760" y="292" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">- One stage forward at a time; stages cannot be skipped or reversed.</text>
<text x="760" y="314" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">- Any open stage can be rejected (dashed). Hired is final.</text>
<text x="760" y="336" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">- Every change writes an application_event row: from, to, user, time, note.</text>
<text x="760" y="358" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">- Moving to Hired adds the person to the staff pool for allocation.</text>
<text x="760" y="380" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">- A closed job accepts no new applicants and no further hires.</text>
</svg>
